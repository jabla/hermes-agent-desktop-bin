name: build-package

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if PKGBUILD already tracks the latest upstream tag'
        type: boolean
        default: false
  schedule:
    # daily check for new upstream tags (release cadence is ~weekly)
    - cron: '23 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    outputs:
      built: ${{ steps.gate.outputs.built }}
    steps:
      - name: Install build toolchain (Arch container)
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git curl \
            nodejs npm python \
            electron42 hicolor-icon-theme libnotify libsecret xdg-utils

      - uses: actions/checkout@v4

      - name: Bump PKGBUILD to new upstream tag (schedules only)
        if: github.event_name == 'schedule'
        env:
          PUSH: '1'
        run: |
          OUT=$(python3 scripts/bump-pkgbuild.py)
          echo "$OUT"
          echo "$OUT" | grep -q '^BUMPED$' && echo "bumped=1" >> "$GITHUB_ENV" || true

      - name: Gate — did this run produce a package?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${bumped:-}" = "1" ]; then
            echo "built=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package (non-root makepkg)
        # manual dispatch always builds; scheduled runs only after a real bump
        if: github.event_name == 'workflow_dispatch' || env.bumped == '1'
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # --nocheck: headless container has no display; upstream runs the full
          # typecheck/vitest suite in its own CI. Packaging correctness is
          # validated separately by a boot smoke test.
          runuser -u builder -- makepkg -f --noconfirm --nocheck

      - name: Show result
        if: github.event_name == 'workflow_dispatch' || env.bumped == '1'
        run: ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst

      - name: Upload package artifact
        if: github.event_name == 'workflow_dispatch' || env.bumped == '1'
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.built == '1'
    container:
      image: archlinux:latest
    steps:
      - name: Install runtime deps + xvfb
        run: |
          pacman -Syu --noconfirm --needed \
            curl git hicolor-icon-theme libnotify libsecret xdg-utils \
            electron42 xorg-server-xvfb

      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg

      - name: Install built package (no compile happens here)
        run: pacman -U --noconfirm pkg/*.pkg.tar.zst

      - name: Boot smoke test under xvfb
        run: |
          mkdir -p "$HOME/.config"
          printf '%s\n' '--no-sandbox' > "$HOME/.config/hermes-desktop-flags.conf"
          set +e
          timeout 40 xvfb-run -a -s '-screen 0 1280x1024x24' \
            hermes-desktop > /tmp/hermes-boot.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "SMOKE-OK: app still running after 40s (killed by timeout)"
          else
            echo "SMOKE-FAIL: exited with rc=$rc"
            tail -n 60 /tmp/hermes-boot.log
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: needs.build.outputs.built == '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg
          path: pkg

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          UPSTREAM=$(grep -oP '(?<=^_pkgver_tag=).*' PKGBUILD)
          TAG="v${PKGVER}-${PKGREL}"
          FILE=$(ls pkg/*.pkg.tar.zst)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" "$FILE" \
              --title "hermes-agent-desktop-bin ${PKGVER}-${PKGREL}" \
              --notes "Prebuilt Arch package from upstream source tag ${UPSTREAM}. Install with: yay -U ${FILE}"
            echo "Release created: $TAG"
          fi
