name: build-package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump PKGBUILD to the latest upstream release and open a PR"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs needing more declare it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Manual dispatch with "bump": move PKGBUILD to the latest upstream release
  # and open an auto-merge PR (never commits to main directly). Build/smoke/
  # release/aur-sync are triggered by the PR checks and the push that follows
  # the merge. There is no schedule: almost every upstream release needs patch
  # work, and upstream releases without a desktop app (v0.21.6) must not be
  # packaged, so a maintainer starts the bump after reading the release.
  # ---------------------------------------------------------------------------
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.bump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
    permissions:
      contents: write
      # gh pr create / gh pr merge --auto need this; a job-level permissions
      # block sets every unlisted scope to none.
      pull-requests: write
    steps:
      - name: Install toolchain (makepkg needed for .SRCINFO regeneration)
        run: pacman -Syu --noconfirm --needed base-devel git github-cli python curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bump pushes with BUMP_TOKEN in the push URL. A persisted
          # workflow token (an auth header for github.com) would take
          # precedence and push as github-actions[bot] instead.
          persist-credentials: false

      # Fail loudly when the PAT is missing or no longer valid: the run then
      # aborts here instead of opening a PR nobody can auto-merge. The workflow
      # token is no fallback — a PR opened with it is bot-authored, its checks
      # need manual approval and its merge never triggers the release pipeline.
      - name: Check the bump token
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BUMP_TOKEN secret is not set — store a fine-grained PAT (Contents + Pull requests: read/write) with: gh secret set BUMP_TOKEN"
            exit 1
          fi
          if ! login=$(gh api /user --jq .login 2>&1); then
            echo "::error::GitHub rejects BUMP_TOKEN (revoked?): $login"
            exit 1
          fi
          echo "bump token identity: $login"

      - name: Bump PKGBUILD + aur/ and open auto-merge PR
        env:
          # The BUMP_TOKEN PAT, never the workflow token (see the check above).
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Only for the script's read-only GitHub API calls (upstream release
          # and tag): unauthenticated calls share 60/hour per runner IP and
          # fail with "HTTP Error 403: rate limit exceeded".
          UPSTREAM_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, and the bump regenerates
          # aur/.SRCINFO with it, so the whole script runs as an unprivileged
          # user — same pattern as the build job.
          useradd -m bumper
          chown -R bumper:bumper "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          runuser -u bumper -- env HOME=/home/bumper \
            GH_TOKEN="$GH_TOKEN" GH_REPO="$GH_REPO" \
            UPSTREAM_API_TOKEN="$UPSTREAM_API_TOKEN" \
            python3 scripts/bump-pkgbuild.py --pr

  # ---------------------------------------------------------------------------
  # Build + smoke: run for PRs (merge gate), pushes to main (after merge) and
  # manual dispatch.
  # A push whose pkgver-pkgrel is already released (CI, scripts, docs) skips
  # them: its PR run built and smoked the change, and release would skip.
  # ---------------------------------------------------------------------------
  plan:
    # Skipped when a manual dispatch only runs the bump. This also keeps
    # build, smoke and release off that run: build only runs when plan was
    # not skipped.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bump) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The merged pull request and its run's artifacts.
      pull-requests: read
      actions: read
    outputs:
      released: ${{ steps.release.outputs.released }}
      # A green pull request run whose package the release takes over.
      reuse_run: ${{ steps.reuse.outputs.run }}
    steps:
      - name: Check whether the pushed version is released already
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # PKGBUILD of the pushed commit, read without a checkout.
          if ! pkgbuild=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${GITHUB_REPOSITORY}/contents/PKGBUILD?ref=${GITHUB_SHA}"); then
            echo "::warning::could not read PKGBUILD at ${GITHUB_SHA}: building"
            echo released=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PKGVER=$(grep -oP '(?<=^pkgver=).*' <<<"$pkgbuild")
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' <<<"$pkgbuild")
          TAG="v${PKGVER}-${PKGREL}"
          # A failed lookup counts as not released: build as before.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: skipping build, smoke and release"
            echo released=true >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG not found"
            echo released=false >> "$GITHUB_OUTPUT"
          fi

      # Build once: the push of a merged pull request from this repository
      # releases the package its last green run built and smoke-tested, when
      # that run built the same tree. Fork pull requests, an expired artifact,
      # another tree or any failed lookup build again as before.
      - name: Find the tested package of the merged pull request
        id: reuse
        if: github.event_name == 'push' && steps.release.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build() { echo "$1: building"; echo run= >> "$GITHUB_OUTPUT"; exit 0; }
          repo=$GITHUB_REPOSITORY
          # GitHub links a merge commit to its pull request a few seconds after
          # the push: a lookup right away can come back empty.
          for attempt in 1 2 3 4; do
            pr=$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" | python3 -c '
          import json, os, sys
          for p in json.load(sys.stdin):
              if (p.get("merged_at") and p["base"]["ref"] == "main"
                      and (p["head"]["repo"] or {}).get("full_name") == os.environ["GITHUB_REPOSITORY"]):
                  print(p["number"], p["head"]["sha"])
                  break') || build "pull request lookup failed"
            [ -n "$pr" ] || [ "$attempt" -eq 4 ] || sleep 15
            [ -z "$pr" ] || break
          done
          [ -n "$pr" ] || build "no merged pull request from $repo"
          read -r number head <<<"$pr"
          # Auto-merge fires when smoke passes; the run itself may finish a
          # few seconds later.
          for attempt in 1 2 3 4; do
            run=$(gh api "repos/$repo/actions/workflows/build.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=1" \
                    --jq '.workflow_runs[0].id // empty') || build "run lookup failed"
            [ -n "$run" ] || [ "$attempt" -eq 4 ] || sleep 15
            [ -z "$run" ] || break
          done
          [ -n "$run" ] || build "no green run of pull request #$number"
          artifacts=$(gh api "repos/$repo/actions/runs/$run/artifacts" \
                        --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') || build "artifact lookup failed"
          for name in pkg build-info; do
            case " $artifacts " in
              *" $name "*) ;;
              *) build "run $run has no unexpired $name artifact" ;;
            esac
          done
          gh run download "$run" --repo "$repo" -n build-info -D /tmp/build-info || build "build-info download failed"
          built=$(cat /tmp/build-info/tree)
          pushed=$(gh api "repos/$repo/git/commits/$GITHUB_SHA" --jq .tree.sha) || build "tree lookup failed"
          [ "$built" = "$pushed" ] || build "run $run built tree $built, main has $pushed"
          echo "Releasing the package of run $run (pull request #$number, tree $pushed)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # Skip only when plan reported an existing release. A failed plan must not
    # skip build and smoke: skipped required checks count as passed.
    if: ${{ !cancelled() && needs.plan.result != 'skipped' && needs.plan.outputs.released != 'true' && needs.plan.outputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    steps:
      - name: Install base toolchain (Arch container)
        run: pacman -Syu --noconfirm --needed base-devel git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate aur/.SRCINFO and the wrapper's metadata
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- sh -c 'cd "$GITHUB_WORKSPACE/aur" && makepkg --printsrcinfo | diff -q - .SRCINFO'
          runuser -u builder -- bash "$GITHUB_WORKSPACE/scripts/check-metadata.sh"

      # npm's downloads: PKGBUILD keeps its npm cache in $srcdir/npm-cache.
      # A pull request restores the caches of its own runs and of main.
      - name: Restore the npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/npm-cache
          key: npm-cache-${{ hashFiles('PKGBUILD', '*.patch') }}
          restore-keys: npm-cache-

      - name: Hand the cache to the build user
        run: install -d -o builder -g builder src && chown -R builder:builder src

      - name: Install dependencies declared in PKGBUILD
        run: |
          # Read them from PKGBUILD itself, so CI installs exactly what
          # makepkg -s would and cannot drift from a hand-kept list. The one
          # exception is hermes-agent, the app's runtime: it comes from the
          # AUR (pacman cannot install it here) and is not needed to build.
          # makepkg therefore runs with --nodeps below.
          cd "$GITHUB_WORKSPACE"
          mapfile -t deps < <(runuser -u builder -- makepkg --printsrcinfo |
            sed -nE 's/^\t(depends|makedepends|checkdepends) = //p' | grep -vE '^hermes-agent([<>=].*)?$')
          pacman -S --noconfirm --needed "${deps[@]}"

      - name: Build package (non-root makepkg, with check())
        run: |
          cd "$GITHUB_WORKSPACE"
          # check() runs the typecheck, the vitest tests covering the patched
          # files, the launcher test and the node-pty load test under the
          # system Electron (_electron in PKGBUILD).
          runuser -u builder -- makepkg -f --noconfirm --nodeps

      - name: Show result
        run: ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst

      # AUR users install aur/PKGBUILD re-wrapping this artifact, not the
      # artifact itself, so build the wrapper from it the way their makepkg
      # does (the file in place of the download) and compare the payloads.
      - name: Build the AUR wrapper from this artifact
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          artifact=$(ls hermes-agent-desktop-bin-*-x86_64.pkg.tar.zst)
          prebuilt=$(sed -nE 's/^\tnoextract = //p' aur/.SRCINFO)
          sha=$(sha256sum "$artifact" | cut -d' ' -f1)
          work=$(mktemp -d)
          cp aur/PKGBUILD "$work/"
          cp "$artifact" "$work/$prebuilt"
          # Pin the artifact's sha the way aur-sync does for the release.
          sed -i -E "s|^(sha256sums=\(')[0-9a-f]{64}('\))|\1${sha}\2|" "$work/PKGBUILD"
          grep -qx "sha256sums=('${sha}')" "$work/PKGBUILD"
          chown -R builder:builder "$work"
          runuser -u builder -- sh -c 'cd "$1" && makepkg -f --noconfirm --nodeps' sh "$work"
          # A rebuild must still find the download intact. A wrapper whose
          # download is named like its own output overwrites it.
          if ! echo "${sha}  $work/$prebuilt" | sha256sum -c --quiet; then
            echo "::error::makepkg overwrote the wrapper's download $prebuilt"
            exit 1
          fi
          # Same files, modes, links and sha256 digests as the artifact;
          # only mtimes and the package metadata differ.
          manifest() {
            bsdtar -xOf "$1" .MTREE | gzip -dc |
              grep -vE '^\./\.(BUILDINFO|PKGINFO) ' | sed -E 's/ time=[0-9.]+//'
          }
          if ! diff -u <(manifest "$artifact") <(manifest "$work/$artifact") > /tmp/wrapper.diff; then
            echo "::error::the AUR wrapper does not install the artifact's payload unchanged"
            head -n 60 /tmp/wrapper.diff
            exit 1
          fi
          echo "WRAPPER-OK: aur/PKGBUILD reproduces the artifact's payload ($(manifest "$artifact" | wc -l) manifest lines)"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg
          path: '*.pkg.tar.zst'
          if-no-files-found: error
          # Smoke and the release need it (the release of a merged pull
          # request takes it from that pull request's run); the release keeps
          # the file.
          retention-days: 3

      # The tree this run built, for the release of the merged pull request.
      - name: Record the built tree
        run: |
          install -d build-info
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}' > build-info/tree
          cat build-info/tree

      - name: Upload the build info
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-info
          path: build-info/tree
          if-no-files-found: error
          retention-days: 3

  smoke:
    runs-on: ubuntu-latest
    needs: build
    # Explicit, or a failed plan would skip it despite a green build.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 20
    container:
      image: archlinux:latest
      # Chromium loads the UI's ~1000 assets through shared memory. With
      # docker's default 64 MB /dev/shm the loads fail and the window stays
      # blank.
      options: --shm-size=1g
    env:
      # The hermes-agent-bin release the app boots on (it provides
      # hermes-agent). Pin the one the AUR ships, never one older than the
      # desktop version: users run the app on that runtime. Change version
      # and checksum together.
      RUNTIME_VER: 0.22.5-2
      RUNTIME_SUM: 2cfefd7e768266cd272178c23d075421f6ae0368ba515f7babf500a72df151f9
    steps:
      # Runtime dependencies are deliberately not preinstalled: pacman -U has
      # to resolve them from the packages' own depends=().
      - name: Install xvfb
        run: pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xprop xorg-xwininfo

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: pkg

      # hermes-agent comes from the AUR, so pacman cannot resolve it from the
      # repositories: the pinned runtime goes into the same transaction.
      - name: Install the pinned runtime and the built package (no compile happens here)
        run: |
          set -euo pipefail
          runtime_pkg="hermes-agent-bin-${RUNTIME_VER}-x86_64.pkg.tar.zst"
          curl -fsSL -o "/tmp/${runtime_pkg}" \
            "https://github.com/jabla/hermes-agent-bin/releases/download/v${RUNTIME_VER}/${runtime_pkg}"
          echo "${RUNTIME_SUM}  /tmp/${runtime_pkg}" | sha256sum -c -
          pacman -U --noconfirm "/tmp/${runtime_pkg}" pkg/*.pkg.tar.zst
          test -x /usr/bin/hermes

      # The steps below run the app's Electron the way the installed launcher
      # does: the system electronNN it execs (_electron in PKGBUILD).
      - name: Find the Electron runtime the launcher runs
        run: |
          set -euo pipefail
          electron=$(sed -nE 's|^exec /usr/bin/(electron[0-9]+) .*|\1|p' /usr/bin/hermes-desktop)
          if [ -z "$electron" ] || [ ! -x "/usr/lib/${electron}/electron" ]; then
            echo "SMOKE-FAIL: /usr/bin/hermes-desktop names no installed electronNN (found '${electron}')"
            exit 1
          fi
          # A name of its own: the app and its gateway inherit the step env.
          echo "SMOKE_ELECTRON=/usr/lib/${electron}/electron" >> "$GITHUB_ENV"
          echo "the launcher runs ${electron}"

      - name: Load the installed node-pty addon with that Electron
        run: |
          node_pty=/usr/lib/hermes-agent-desktop/app.asar.unpacked/dist/node_modules/node-pty
          test -f "$node_pty/package.json"
          env ELECTRON_RUN_AS_NODE=1 NODE_PTY_ROOT="$node_pty" \
            "$SMOKE_ELECTRON" -e \
            'const pty = require(process.env.NODE_PTY_ROOT); if (typeof pty.spawn !== "function") process.exit(1)'

      # The app must be the version the package claims to be (prepare() writes
      # pkgver into the desktop package.json; Electron reads the asar).
      - name: Check the packaged app version
        run: |
          set -euo pipefail
          pkgver=$(pacman -Q hermes-agent-desktop-bin | cut -d' ' -f2)
          pkgver=${pkgver%-*}
          appver=$(env ELECTRON_RUN_AS_NODE=1 "$SMOKE_ELECTRON" -p \
            "require('/usr/lib/hermes-agent-desktop/app.asar/package.json').version")
          if [ "$appver" != "$pkgver" ]; then
            echo "SMOKE-FAIL: the packaged app reports version $appver, the package is $pkgver"
            exit 1
          fi
          echo "SMOKE-OK: the packaged app reports version $appver"

      # With a group-writable profile home (or on Windows) the app mints its
      # gateway tickets through the runtime's own interpreter: it reads the
      # install root from `hermes --version` and asks the launcher for the
      # interpreter (--print-runtime-command), then imports the ticket client
      # with it. A runtime without that answer leaves every API call failing
      # there; the boot below uses the default, private home.
      - name: The runtime names its interpreter for gateway tickets
        run: |
          set -euo pipefail
          root=$(/usr/bin/hermes --version 2>/dev/null | sed -n 's/^Install directory: //p')
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "SMOKE-FAIL: hermes --version names no install directory ('$root')"
            exit 1
          fi
          if ! runtime=$(cd "$root" && /usr/bin/hermes --print-runtime-command 2> /tmp/runtime.err); then
            echo "SMOKE-FAIL: /usr/bin/hermes --print-runtime-command failed:"
            cat /tmp/runtime.err
            exit 1
          fi
          python=$(python3 -c 'import json, sys; c = json.loads(sys.argv[1]); print(c[0] if isinstance(c, list) and c else "")' "$runtime") || python=
          if [[ "$python" != /* ]] || [ ! -f "$python" ]; then
            echo "SMOKE-FAIL: hermes --print-runtime-command names no interpreter: $runtime"
            exit 1
          fi
          # The app's ticket helper runs `<python> -P -u -c ...` with the
          # install root on PYTHONPATH and imports these first.
          if ! PYTHONPATH="$root" "$python" -P -c \
              'from hermes_cli.gateway_client import _session_ticket; from hermes_cli.gateway_runtime_discovery import DiscoveryError, _private_node' \
              2> /tmp/ticket-import.err; then
            echo "SMOKE-FAIL: $python cannot import the gateway ticket client:"
            tail -n 20 /tmp/ticket-import.err
            exit 1
          fi
          echo "SMOKE-OK: /usr/bin/hermes names $python for gateway tickets (install root $root)"

      # The launcher points the app at the runtime's /usr/bin/hermes. Since
      # 0.22.4 the app runs `hermes gateway ensure` through it and attaches
      # to that gateway, which must carry the wrapper's environment. The app
      # must not stop at the first-run setup screen and must never write an
      # agent tree of its own. Its UI must come up: the renderer logs the
      # local connection it picked. The window must be styled and an API
      # call with a gateway ticket must succeed.
      - name: Boot smoke test under xvfb
        run: |
          mkdir -p "$HOME/.config"
          printf '%s\n' '--no-sandbox' > "$HOME/.config/hermes-desktop-flags.conf"

          stamp=$(grep -oE '"commit": *"[0-9a-f]{12}' /usr/lib/hermes-agent-desktop/install-stamp.json |
            grep -oE '[0-9a-f]{12}$' || true)
          if [ -z "$stamp" ]; then
            echo "SMOKE-FAIL: no commit in the installed install-stamp.json"
            exit 1
          fi

          # stdout/stderr only carry the launcher's and Electron's output and
          # the install stamp; the app's boot decisions go to the desktop log,
          # the detached gateway writes its own logs.
          desktop_log="$HOME/.hermes/logs/desktop.log"
          fail() {
            local log
            echo "--- stdout ---"
            tail -n 40 /tmp/hermes-boot.log
            echo "--- desktop.log ---"
            tail -n 40 /tmp/hermes-desktop.log
            for log in gateway-stdio.log gateway.log; do
              if [ -s "$HOME/.hermes/logs/$log" ]; then
                echo "--- $log ---"
                tail -n 30 "$HOME/.hermes/logs/$log"
              fi
            done
            exit 1
          }

          # Record the gateway's environment (this shell has no HERMES_*
          # variables of its own) and compare it after the boot. With no
          # gateway service installed, `hermes gateway ensure` starts
          # `python -m hermes_cli.main [selector] gateway run ...` with the
          # environment of the ensure call through /usr/bin/hermes.
          backend_pid() {
            local proc args
            for proc in /proc/[0-9]*; do
              mapfile -d '' -t args < "$proc/cmdline" 2>/dev/null || continue
              [ "${args[1]:-}" = -m ] && [ "${args[2]:-}" = hermes_cli.main ] || continue
              if [[ " ${args[*]:3} " == *" gateway run "* ]]; then
                echo "${proc#/proc/}"
                return 0
              fi
            done
            return 1
          }
          # As long as the UI wait below, with a margin.
          (
            for _ in $(seq 100); do
              if pid=$(backend_pid) && tr '\0' '\n' < "/proc/${pid}/environ" > /tmp/hermes-backend.env; then
                exit 0
              fi
              sleep 1
            done
            exit 1
          ) &
          env_watch=$!

          # The app must still run 15 s after its UI reported the local
          # connection (or after 90 s without that line); then it is stopped.
          # timeout runs it in a process group of its own and passes the stop
          # on to all of it; the gateway runs in a session of its own and
          # outlives the app until the container ends. Still running is not
          # enough: Electron keeps a window open after a main-process
          # exception. A missing install stamp does not stop the boot either.
          ui='[gateway-route win=main] published connection=local'

          # Asked over the DevTools port with the package's own Electron as
          # Node. Styled: elements with Tailwind's flex class are flex boxes.
          # A renderer built without the utilities shows bare text, a UI that
          # never mounted has no such elements. API: the renderer's own
          # bridge requests /api/status, which needs a gateway ticket. A
          # failure is retried for a few seconds (a gateway that is still
          # settling), then reported.
          cat > /tmp/ui-probe.mjs <<'EOF'
          const port = process.argv[2]
          const page = (await (await fetch(`http://127.0.0.1:${port}/json`)).json())
            .find(t => t.type === 'page' && t.url.includes('/index.html'))
          if (!page) {
            console.log('no app window on the DevTools port')
            process.exit(1)
          }
          const ws = new WebSocket(page.webSocketDebuggerUrl)
          await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject })
          let next = 0
          const evaluate = expression => new Promise(resolve => {
            const id = ++next
            ws.addEventListener('message', ev => { const m = JSON.parse(ev.data); if (m.id === id) resolve(m.result?.result?.value) })
            ws.send(JSON.stringify({ id, method: 'Runtime.evaluate', params: { returnByValue: true, awaitPromise: true, expression } }))
          })
          const [all, flex] = await evaluate(`(() => {
            const els = [...document.querySelectorAll('.flex')]
            return [els.length, els.filter(e => getComputedStyle(e).display === 'flex').length]
          })()`) ?? [0, 0]
          console.log(`${flex} of ${all} elements with the flex class are flex boxes`)
          let api
          for (let attempt = 1; attempt <= 5; attempt++) {
            api = await evaluate(`window.hermesDesktop.api({ path: '/api/status' }).then(
              r => ({ ok: true, keys: Object.keys(r ?? {}).length }),
              e => ({ ok: false, error: String(e?.message ?? e) }))`) ?? { ok: false, error: 'no reply' }
            if (api.ok) break
            await new Promise(resolve => setTimeout(resolve, 2000))
          }
          console.log(api.ok ? `GET /api/status answered (${api.keys} fields)` : `GET /api/status failed: ${api.error}`)
          process.exit(all > 0 && flex > 0 && api.ok ? 0 : 1)
          EOF
          probe='UI never came up'
          probe_rc=1

          # Settings offers no translucency on Linux, yet Electron 44 applies
          # a native opacity there (NousResearch/hermes-agent#143426). Prints
          # the _NET_WM_WINDOW_OPACITY of each visible app window ("none" when
          # it has none); fails when the display shows no app window.
          window_opacity() (
            export DISPLAY=:99 XAUTHORITY=/tmp/xvfb.auth
            found=1
            for id in $(xwininfo -root -children | grep -oE '^ +0x[0-9a-f]+'); do
              [[ $(xprop -id "$id" WM_CLASS) == *com.nousresearch.hermes* ]] || continue
              [[ $(xwininfo -id "$id") == *'Map State: IsViewable'* ]] || continue
              found=0
              value=$(xprop -id "$id" _NET_WM_WINDOW_OPACITY | grep -oE '[0-9]+$' || true)
              echo "${value:-none}"
            done
            return "$found"
          )
          opacity='not checked'

          started=$SECONDS
          timeout -k 10 120 xvfb-run -n 99 -f /tmp/xvfb.auth -s '-screen 0 1280x1024x24' \
            hermes-desktop --remote-debugging-port=9339 > /tmp/hermes-boot.log 2>&1 &
          app=$!
          for _ in $(seq 90); do
            if grep -qF "$ui" "$desktop_log" 2>/dev/null || ! kill -0 "$app" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if grep -qF "$ui" "$desktop_log" 2>/dev/null; then
            echo "UI up after $((SECONDS - started)) s"
            sleep 15
            probe_rc=0
            probe=$(ELECTRON_RUN_AS_NODE=1 timeout 40 "$SMOKE_ELECTRON" /tmp/ui-probe.mjs 9339 2>&1) ||
              probe_rc=$?
            if windows=$(window_opacity); then
              opacity=$(sort -u <<< "$windows" | paste -sd ' ')
            else
              opacity='no app window on the display'
            fi
          fi
          running=false
          if kill -0 "$app" 2>/dev/null; then
            running=true
            kill "$app" 2>/dev/null || true
          fi
          rc=0
          wait "$app" || rc=$?
          # A gateway that has not started by now never will.
          kill "$env_watch" 2>/dev/null || true
          wait "$env_watch" || true
          cp "$desktop_log" /tmp/hermes-desktop.log 2>/dev/null || : > /tmp/hermes-desktop.log
          if [ "$running" != true ]; then
            echo "SMOKE-FAIL: exited with rc=$rc"
            fail
          fi
          if grep -qE 'App threw an error during load|A JavaScript error occurred in the main process|Uncaught Exception' /tmp/hermes-boot.log; then
            echo "SMOKE-FAIL: main process error while booting"
            fail
          fi
          if ! grep -qF "[hermes] install stamp: ${stamp}" /tmp/hermes-boot.log; then
            echo "SMOKE-FAIL: packaged install stamp ${stamp} was not loaded"
            fail
          fi
          for line in 'Using existing Hermes CLI at /usr/bin/hermes' \
                      'Hermes gateway is ready' \
                      "$ui"; do
            if ! grep -qF "$line" /tmp/hermes-desktop.log; then
              echo "SMOKE-FAIL: desktop.log lacks: $line"
              fail
            fi
          done
          if [ "$probe_rc" -ne 0 ]; then
            echo "SMOKE-FAIL: the window is not styled or its API call failed: $probe"
            fail
          fi
          if [ "$opacity" != none ]; then
            echo "SMOKE-FAIL: the window must be opaque, _NET_WM_WINDOW_OPACITY: $opacity"
            fail
          fi
          if grep -qE 'Waiting for first-run setup choice|first-launch bootstrap|REFUSING installer' /tmp/hermes-desktop.log; then
            echo "SMOKE-FAIL: the app went for the first-run setup although the runtime is installed"
            fail
          fi
          if [ -e "$HOME/.hermes/hermes-agent" ]; then
            echo "SMOKE-FAIL: the app wrote an agent tree to ~/.hermes/hermes-agent"
            fail
          fi
          wrapper_vars=$(sed -nE 's/^export ([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' /usr/bin/hermes)
          if [ -z "$wrapper_vars" ]; then
            echo "SMOKE-FAIL: /usr/bin/hermes exports no variables to compare"
            fail
          fi
          if [ ! -s /tmp/hermes-backend.env ]; then
            echo "SMOKE-FAIL: no gateway process (python -m hermes_cli.main ... gateway run) found"
            fail
          fi
          for var in $wrapper_vars; do
            if ! grep -q "^${var}=" /tmp/hermes-backend.env; then
              echo "SMOKE-FAIL: the gateway lacks ${var}, which /usr/bin/hermes sets"
              fail
            fi
          done
          echo "SMOKE-OK: app and UI booted on the gateway /usr/bin/hermes started, with its environment:" $wrapper_vars
          echo "SMOKE-OK: ${probe//$'\n'/; }"

  # ---------------------------------------------------------------------------
  # Release + AUR sync: only after a merge to main or a manual dispatch ON main
  # (never from pull_request or another branch — no releases of unreviewed code).
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [plan, build, smoke]
    # Built and smoked here, or taken over from the merged pull request's run.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && ((needs.build.result == 'success' && needs.smoke.result == 'success') || (needs.plan.result == 'success' && needs.plan.outputs.reuse_run != '')) }}
    timeout-minutes: 10
    permissions:
      contents: write
      # The package of another run.
      actions: read
    env:
      BUILD_RUN: ${{ needs.plan.outputs.reuse_run || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the package of this run
        if: needs.plan.outputs.reuse_run == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: pkg

      - name: Download the package of the merged pull request's run
        if: needs.plan.outputs.reuse_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: pkg
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ github.token }}

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: NousResearch/hermes-agent
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          UPSTREAM=$(grep -oP '(?<=^_pkgver_tag=).*' PKGBUILD)
          UPSTREAM_COMMIT=$(grep -oP '(?<=^_commit=).*' PKGBUILD)
          TAG="v${PKGVER}-${PKGREL}"
          FILE=$(ls pkg/*.pkg.tar.zst)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          # Previous upstream tag, for the compare link. Best effort only: never
          # fail the release because upstream's release list looks unexpected.
          PREV=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" \
                   | python3 -c 'import json,sys; t=[r["tag_name"] for r in json.load(sys.stdin)]; c=sys.argv[1]; i=t.index(c) if c in t else -1; print(t[i+1] if 0 <= i and i+1 < len(t) else "")' "$UPSTREAM" \
                   2>/dev/null || true)
          {
            printf 'Prebuilt Arch package `%s-%s`, re-wrapped from the upstream source tag `%s` — nothing is compiled at install time.\n\n' \
              "$PKGVER" "$PKGREL" "$UPSTREAM"
            printf -- '- [Upstream release %s](https://github.com/%s/releases/tag/%s)\n' \
              "$UPSTREAM" "$UPSTREAM_REPO" "$UPSTREAM"
            if [ -n "$PREV" ]; then
              printf -- '- [Upstream changes %s -> %s](https://github.com/%s/compare/%s...%s)\n' \
                "$PREV" "$UPSTREAM" "$UPSTREAM_REPO" "$PREV" "$UPSTREAM"
            else
              printf -- '- [Upstream changes](https://github.com/%s/releases)\n' "$UPSTREAM_REPO"
            fi
            printf -- '\nUpstream commit: `%s`\nArtifact sha256: `%s`\nBuilt and smoke-tested in: %s/%s/actions/runs/%s\n' \
              "$UPSTREAM_COMMIT" "$(sha256sum "$FILE" | cut -d' ' -f1)" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BUILD_RUN"
          } > /tmp/notes.md
          cat /tmp/notes.md
          # --target: tag the commit that was built, not whatever main is now.
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "hermes-agent-desktop-bin ${PKGVER}-${PKGREL}" \
            --notes-file /tmp/notes.md
          echo "Release created: $TAG"

  aur-sync:
    runs-on: ubuntu-latest
    needs: [plan, release]
    # Also after a push that skipped the release (version already released):
    # aur/ may have changed, and the artifact comes from the release anyway.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.release.result == 'success' || needs.plan.outputs.released == 'true') }}
    timeout-minutes: 10
    # Keep AUR_SSH_KEY as a secret of this environment, restricted to main
    # (Settings → Environments): pull requests from branches of this
    # repository can read repository-level secrets.
    environment: aur
    # One publisher at a time; the main-HEAD check below drops stale runs.
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute release artifact sha256 and pin it into aur/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          FILE="hermes-agent-desktop-bin-${PKGVER}-${PKGREL}-x86_64.pkg.tar.zst"
          # Authenticated download: also works in a private copy of this repo.
          gh release download "v${PKGVER}-${PKGREL}" --repo "$GITHUB_REPOSITORY" \
            --pattern "$FILE" --output /tmp/pkg.pkg.tar.zst
          SHA=$(sha256sum /tmp/pkg.pkg.tar.zst | cut -d' ' -f1)
          sed -i -E "s|^(sha256sums=\(')[0-9a-f]{64}('\))|\1${SHA}\2|" aur/PKGBUILD
          sed -i -E "s|^([[:space:]]*sha256sums = )[0-9a-f]{64}|\1${SHA}|" aur/.SRCINFO
          # sed succeeds even when nothing matched: never publish a stale sum.
          grep -qx "sha256sums=('${SHA}')" aur/PKGBUILD
          grep -qxP "\tsha256sums = ${SHA}" aur/.SRCINFO
          echo "artifact sha256=${SHA}"

      - name: Push aur/ to AUR git (publish; dry run in copies of this repo)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          # A slower run for an older commit must not overwrite what a newer
          # main has already published.
          MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN" != "$GITHUB_SHA" ]; then
            echo "main moved on to ${MAIN}; not publishing ${GITHUB_SHA}"
            exit 0
          fi
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_KEY is empty — store the AUR key as a secret of the aur environment"
            exit 1
          fi
          git config --global user.name "hermes-agent-desktop-bin CI"
          git config --global user.email "jabla@users.noreply.github.com"
          rm -rf /tmp/aur
          # Only the canonical repository publishes. Copies (forks, a CI test
          # repository) clone the public AUR repository read-only and show the
          # diff they would push.
          if [ "$GITHUB_REPOSITORY" = jabla/hermes-agent-desktop-bin ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_ci && chmod 600 ~/.ssh/aur_ci
            ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ci -o IdentitiesOnly=yes"
            git clone ssh://aur@aur.archlinux.org/hermes-agent-desktop-bin.git /tmp/aur
          else
            git clone https://aur.archlinux.org/hermes-agent-desktop-bin.git /tmp/aur
          fi
          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          # Stage first: git diff alone ignores untracked files, so a fresh
          # (empty) AUR repo would falsely report "nothing to push" and never
          # create the initial commit.
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package up to date, nothing to push"
          elif [ "$GITHUB_REPOSITORY" != jabla/hermes-agent-desktop-bin ]; then
            echo "DRY RUN in ${GITHUB_REPOSITORY}: would push ${PKGVER}-${PKGREL} to the AUR:"
            git diff --cached
          else
            git commit -m "Update to ${PKGVER}-${PKGREL}"
            git push origin master
            echo "AUR updated to ${PKGVER}-${PKGREL}"
          fi
