name: build-package

on:
  workflow_dispatch:
  schedule:
    # daily check for new upstream tags (release cadence is ~weekly)
    - cron: '23 3 * * *'
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs needing more declare it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Schedule: detect new upstream release -> open auto-merge PR (never commits
  # to main directly). Build/smoke/release/aur-sync are triggered by the PR
  # checks and the push that follows the merge.
  # ---------------------------------------------------------------------------
  bump:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install toolchain (makepkg needed for .SRCINFO regeneration)
        run: pacman -Syu --noconfirm --needed base-devel git github-cli python curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump PKGBUILD + aur/ and open auto-merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/bump-pkgbuild.py --pr

  # ---------------------------------------------------------------------------
  # Build + smoke: run for PRs (merge gate), pushes to main (after merge) and
  # manual dispatch. Never on schedule (bump job handles that).
  # ---------------------------------------------------------------------------
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build toolchain (Arch container)
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git curl \
            nodejs npm python \
            electron42 hicolor-icon-theme libnotify libsecret xdg-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate aur/.SRCINFO matches aur/PKGBUILD
        run: |
          useradd -m validator
          chown -R validator:validator "$GITHUB_WORKSPACE"
          runuser -u validator -- sh -c 'cd "$GITHUB_WORKSPACE/aur" && makepkg --printsrcinfo | diff -q - .SRCINFO'

      - name: Build package (non-root makepkg)
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # --nocheck: headless container has no display; upstream runs the full
          # typecheck/vitest suite in its own CI. Packaging correctness is
          # validated separately by a boot smoke test.
          runuser -u builder -- makepkg -f --noconfirm --nocheck

      - name: Show result
        run: ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: archlinux:latest
    steps:
      - name: Install runtime deps + xvfb
        run: |
          pacman -Syu --noconfirm --needed \
            curl git hicolor-icon-theme libnotify libsecret xdg-utils \
            electron42 xorg-server-xvfb

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Install built package (no compile happens here)
        run: pacman -U --noconfirm pkg/*.pkg.tar.zst

      - name: Boot smoke test under xvfb
        run: |
          mkdir -p "$HOME/.config"
          printf '%s\n' '--no-sandbox' > "$HOME/.config/hermes-desktop-flags.conf"
          set +e
          timeout 40 xvfb-run -a -s '-screen 0 1280x1024x24' \
            hermes-desktop > /tmp/hermes-boot.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "SMOKE-OK: app still running after 40s (killed by timeout)"
          else
            echo "SMOKE-FAIL: exited with rc=$rc"
            tail -n 60 /tmp/hermes-boot.log
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Release + AUR sync: only after a merge to main or manual dispatch
  # (never from pull_request — no secrets/releases on untrusted code).
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          UPSTREAM=$(grep -oP '(?<=^_pkgver_tag=).*' PKGBUILD)
          TAG="v${PKGVER}-${PKGREL}"
          FILE=$(ls pkg/*.pkg.tar.zst)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" "$FILE" \
              --title "hermes-agent-desktop-bin ${PKGVER}-${PKGREL}" \
              --notes "Prebuilt Arch package from upstream source tag ${UPSTREAM}. Install with: yay -U ${FILE}"
            echo "Release created: $TAG"
          fi

  aur-sync:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push aur/ to AUR git (publish)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_ci && chmod 600 ~/.ssh/aur_ci
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          git config --global user.name "hermes-agent-desktop-bin CI"
          git config --global user.email "jabla@users.noreply.github.com"
          rm -rf /tmp/aur
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ci -o IdentitiesOnly=yes" \
            git clone ssh://aur@aur.archlinux.org/hermes-agent-desktop-bin.git /tmp/aur
          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          # Stage first: git diff alone ignores untracked files, so a fresh
          # (empty) AUR repo would falsely report "nothing to push" and never
          # create the initial commit.
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package up to date, nothing to push"
          else
            git commit -m "Update to ${PKGVER}-${PKGREL}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ci -o IdentitiesOnly=yes" \
              git push origin master
            echo "AUR updated to ${PKGVER}-${PKGREL}"
          fi
