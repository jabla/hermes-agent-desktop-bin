name: build-package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Run the upstream bump check now (normally schedule-only)"
        type: boolean
        default: false
  schedule:
    # check every 2 hours for new upstream tags (release cadence is ~weekly)
    - cron: '23 */2 * * *'
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs needing more declare it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Schedule: detect new upstream release -> open auto-merge PR (never commits
  # to main directly). Build/smoke/release/aur-sync are triggered by the PR
  # checks and the push that follows the merge.
  # ---------------------------------------------------------------------------
  bump:
    # The schedule only bumps the canonical repository; copies (forks, a CI
    # test repository) bump on manual dispatch only and idle for free.
    if: (github.event_name == 'schedule' && github.repository == 'jabla/hermes-agent-desktop-bin') || (github.event_name == 'workflow_dispatch' && inputs.bump)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: archlinux:latest
    permissions:
      contents: write
      # gh pr create / gh pr merge --auto need this; a job-level permissions
      # block sets every unlisted scope to none.
      pull-requests: write
    steps:
      - name: Install toolchain (makepkg needed for .SRCINFO regeneration)
        run: pacman -Syu --noconfirm --needed base-devel git github-cli python curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The bump pushes with BUMP_TOKEN in the push URL. A persisted
          # workflow token (an auth header for github.com) would take
          # precedence and push as github-actions[bot] instead.
          persist-credentials: false

      # Fail loudly when the PAT is missing or no longer valid: the run then
      # aborts here instead of opening a PR nobody can auto-merge. The workflow
      # token is no fallback — a PR opened with it is bot-authored, its checks
      # need manual approval and its merge never triggers the release pipeline.
      - name: Check the bump token
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BUMP_TOKEN secret is not set — store a fine-grained PAT (Contents + Pull requests: read/write) with: gh secret set BUMP_TOKEN"
            exit 1
          fi
          if ! login=$(gh api /user --jq .login 2>&1); then
            echo "::error::GitHub rejects BUMP_TOKEN (revoked?): $login"
            exit 1
          fi
          echo "bump token identity: $login"

      - name: Bump PKGBUILD + aur/ and open auto-merge PR
        env:
          # The BUMP_TOKEN PAT, never the workflow token (see the check above).
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Only for the script's read-only GitHub API calls (upstream release
          # and tag): unauthenticated calls share 60/hour per runner IP and
          # fail with "HTTP Error 403: rate limit exceeded".
          UPSTREAM_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, and the bump regenerates
          # aur/.SRCINFO with it, so the whole script runs as an unprivileged
          # user — same pattern as the build job.
          useradd -m bumper
          chown -R bumper:bumper "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          runuser -u bumper -- env HOME=/home/bumper \
            GH_TOKEN="$GH_TOKEN" GH_REPO="$GH_REPO" \
            UPSTREAM_API_TOKEN="$UPSTREAM_API_TOKEN" \
            python3 scripts/bump-pkgbuild.py --pr

  # ---------------------------------------------------------------------------
  # Build + smoke: run for PRs (merge gate), pushes to main (after merge) and
  # manual dispatch. Never on schedule (bump job handles that).
  # ---------------------------------------------------------------------------
  build:
    # not on schedule; also skipped when a manual dispatch only runs the bump
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.bump)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:latest
    steps:
      - name: Install base toolchain (Arch container)
        run: pacman -Syu --noconfirm --needed base-devel git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate aur/.SRCINFO and the wrapper's metadata
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- sh -c 'cd "$GITHUB_WORKSPACE/aur" && makepkg --printsrcinfo | diff -q - .SRCINFO'
          runuser -u builder -- bash "$GITHUB_WORKSPACE/scripts/check-metadata.sh"

      - name: Install dependencies declared in PKGBUILD
        run: |
          # Read them from PKGBUILD itself, so CI installs exactly what
          # makepkg -s would and cannot drift from a hand-kept list.
          cd "$GITHUB_WORKSPACE"
          mapfile -t deps < <(runuser -u builder -- makepkg --printsrcinfo |
            sed -nE 's/^\t(depends|makedepends|checkdepends) = //p')
          pacman -S --noconfirm --needed "${deps[@]}"

      - name: Build package (non-root makepkg, with check())
        run: |
          cd "$GITHUB_WORKSPACE"
          # check() runs the typecheck, the vitest tests covering the patched
          # files, the packaging regression tests and the node-pty load test
          # under electron42.
          runuser -u builder -- makepkg -f --noconfirm

      - name: Show result
        run: ls -lh "$GITHUB_WORKSPACE"/*.pkg.tar.zst

      # AUR users install aur/PKGBUILD re-wrapping this artifact, not the
      # artifact itself, so build the wrapper from it the way their makepkg
      # does (the file in place of the download) and compare the payloads.
      - name: Build the AUR wrapper from this artifact
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          artifact=$(ls hermes-agent-desktop-bin-*-x86_64.pkg.tar.zst)
          prebuilt=$(sed -nE 's/^\tnoextract = //p' aur/.SRCINFO)
          sha=$(sha256sum "$artifact" | cut -d' ' -f1)
          work=$(mktemp -d)
          cp aur/PKGBUILD "$work/"
          cp "$artifact" "$work/$prebuilt"
          # Pin the artifact's sha the way aur-sync does for the release.
          sed -i -E "s|^(sha256sums=\(')[0-9a-f]{64}('\))|\1${sha}\2|" "$work/PKGBUILD"
          grep -qx "sha256sums=('${sha}')" "$work/PKGBUILD"
          chown -R builder:builder "$work"
          # Twice: a rebuild must still find the download intact. A wrapper
          # whose download is named like its own output overwrites it.
          runuser -u builder -- sh -c 'cd "$1" && makepkg -f --noconfirm && makepkg -f --noconfirm' sh "$work"
          # Same files, modes, links and sha256 digests as the artifact;
          # only mtimes and the package metadata differ.
          manifest() {
            bsdtar -xOf "$1" .MTREE | gzip -dc |
              grep -vE '^\./\.(BUILDINFO|PKGINFO) ' | sed -E 's/ time=[0-9.]+//'
          }
          if ! diff -u <(manifest "$artifact") <(manifest "$work/$artifact") > /tmp/wrapper.diff; then
            echo "::error::the AUR wrapper does not install the artifact's payload unchanged"
            head -n 60 /tmp/wrapper.diff
            exit 1
          fi
          echo "WRAPPER-OK: aur/PKGBUILD reproduces the artifact's payload ($(manifest "$artifact" | wc -l) manifest lines)"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg
          path: '*.pkg.tar.zst'
          if-no-files-found: error
          # Only smoke and release of this run need it; the release keeps the file.
          retention-days: 3

  smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      # Runtime dependencies are deliberately not preinstalled: pacman -U has
      # to resolve them from the package's own depends=().
      - name: Install xvfb
        run: pacman -Syu --noconfirm --needed xorg-server-xvfb

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Install built package (no compile happens here)
        run: pacman -U --noconfirm pkg/*.pkg.tar.zst

      - name: Load the installed node-pty addon with electron42
        run: |
          node_pty=/usr/lib/hermes-agent-desktop/app.asar.unpacked/dist/node_modules/node-pty
          test -f "$node_pty/package.json"
          env ELECTRON_RUN_AS_NODE=1 NODE_PTY_ROOT="$node_pty" \
            /usr/lib/electron42/electron -e \
            'const pty = require(process.env.NODE_PTY_ROOT); if (typeof pty.spawn !== "function") process.exit(1)'

      # The app must be the version the package claims to be (prepare() writes
      # pkgver into the desktop package.json; electron42 reads the asar).
      - name: Check the packaged app version
        run: |
          set -euo pipefail
          pkgver=$(pacman -Q hermes-agent-desktop-bin | cut -d' ' -f2)
          pkgver=${pkgver%-*}
          appver=$(env ELECTRON_RUN_AS_NODE=1 /usr/lib/electron42/electron -p \
            "require('/usr/lib/hermes-agent-desktop/app.asar/package.json').version")
          if [ "$appver" != "$pkgver" ]; then
            echo "SMOKE-FAIL: the packaged app reports version $appver, the package is $pkgver"
            exit 1
          fi
          echo "SMOKE-OK: the packaged app reports version $appver"

      # Two boots. Without a runtime the launcher must leave the upstream
      # first-run flow alone; with the runtime installed (pinned release of
      # hermes-agent-bin, the package the launcher points at) the packaged app
      # must run its backend from /opt/hermes-agent, with the environment the
      # runtime's /usr/bin/hermes wrapper sets, and must not stop at the
      # first-run setup screen. The second boot is the regression this package
      # exists to prevent: the app insists on a policy-patched checkout in
      # $HERMES_HOME/hermes-agent ('package-patch-missing') and would otherwise
      # install a second runtime next to the installed one.
      - name: Boot smoke tests under xvfb
        run: |
          mkdir -p "$HOME/.config"
          printf '%s\n' '--no-sandbox' > "$HOME/.config/hermes-desktop-flags.conf"

          stamp=$(grep -oE '"commit": *"[0-9a-f]{12}' /usr/lib/hermes-agent-desktop/install-stamp.json |
            grep -oE '[0-9a-f]{12}$' || true)
          if [ -z "$stamp" ]; then
            echo "SMOKE-FAIL: no commit in the installed install-stamp.json"
            exit 1
          fi

          # stdout/stderr only carry the launcher's and Electron's output and
          # the install stamp; the app's boot decisions ([boot] ..., backend
          # readiness) go to the desktop log. Each boot NAME starts with a fresh one and leaves
          # /tmp/hermes-boot-NAME.log (stdout) and /tmp/hermes-desktop-NAME.log.
          desktop_log="$HOME/.hermes/logs/desktop.log"

          # Still running is not enough: Electron keeps a window open after a
          # main-process exception, and a missing install stamp still boots.
          boot() {
            rm -f "$desktop_log"
            set +e
            timeout 90 xvfb-run -a -s '-screen 0 1280x1024x24' \
              hermes-desktop > "/tmp/hermes-boot-$1.log" 2>&1
            rc=$?
            set -e
            cp "$desktop_log" "/tmp/hermes-desktop-$1.log" 2>/dev/null || : > "/tmp/hermes-desktop-$1.log"
            if [ "$rc" -ne 124 ]; then
              echo "SMOKE-FAIL: $1: exited with rc=$rc"
              return 1
            fi
            if grep -qE 'App threw an error during load|A JavaScript error occurred in the main process|Uncaught Exception' "/tmp/hermes-boot-$1.log"; then
              echo "SMOKE-FAIL: $1: main process error while booting"
              return 1
            fi
            if ! grep -qF "[hermes] install stamp: ${stamp}" "/tmp/hermes-boot-$1.log"; then
              echo "SMOKE-FAIL: $1: packaged install stamp ${stamp} was not loaded"
              return 1
            fi
          }
          fail() {
            echo "--- stdout ($1) ---"
            tail -n 40 "/tmp/hermes-boot-$1.log"
            echo "--- desktop.log ($1) ---"
            tail -n 40 "/tmp/hermes-desktop-$1.log"
            exit 1
          }
          expect_logged() {
            if ! grep -qF "$2" "/tmp/hermes-desktop-$1.log"; then
              echo "SMOKE-FAIL: $1: desktop.log lacks: $2"
              fail "$1"
            fi
          }

          # 1) No runtime installed: upstream first-run flow, no runtime root.
          boot noruntime || fail noruntime
          expect_logged noruntime '[boot] Waiting for first-run setup choice'
          if grep -qF 'Using Hermes source at' /tmp/hermes-desktop-noruntime.log; then
            echo "SMOKE-FAIL: the launcher pointed the app at a runtime although none is installed"
            fail noruntime
          fi
          echo "SMOKE-OK: no runtime installed, upstream first-run flow reached"

          # 2) Runtime installed: the app must run its backend from
          #    /opt/hermes-agent. Pin the hermes-agent-bin release the AUR
          #    ships, never one older than the desktop version: users run the
          #    app on that runtime, and the assertion needs a runtime whose
          #    `serve` mode the app supports. Change version and checksum
          #    together.
          runtime_ver=0.21.4-1
          runtime_sum=7589c81b0616aba1e0275c71fa4beca586d64e990693916f0e5b91d7cb5fc5fb
          runtime_pkg="hermes-agent-bin-${runtime_ver}-x86_64.pkg.tar.zst"
          curl -fsSL -o "/tmp/${runtime_pkg}" \
            "https://github.com/jabla/hermes-agent-bin/releases/download/v${runtime_ver}/${runtime_pkg}"
          echo "${runtime_sum}  /tmp/${runtime_pkg}" | sha256sum -c -
          pacman -U --noconfirm "/tmp/${runtime_pkg}"
          test -x /opt/hermes-agent/venv/bin/python

          # The app starts the runtime's python directly, not /usr/bin/hermes,
          # so the launcher has to hand the backend that wrapper's environment.
          # Record the running backend's environment (this shell has no
          # HERMES_* variables of its own) and compare it after the boot.
          backend_pid() {
            local proc args
            for proc in /proc/[0-9]*; do
              mapfile -d '' -t args < "$proc/cmdline" 2>/dev/null || continue
              if [ "${args[1]:-}" = -m ] && [ "${args[2]:-}" = hermes_cli.main ] && [ "${args[3]:-}" = serve ]; then
                echo "${proc#/proc/}"
                return 0
              fi
            done
            return 1
          }
          (
            for _ in $(seq 80); do
              if pid=$(backend_pid) && tr '\0' '\n' < "/proc/${pid}/environ" > /tmp/hermes-backend.env; then
                exit 0
              fi
              sleep 1
            done
            exit 1
          ) &
          env_watch=$!

          boot runtime || fail runtime
          wait "$env_watch" || true
          expect_logged runtime '[boot] Using Hermes source at /opt/hermes-agent'
          expect_logged runtime 'Hermes backend is ready. Finalizing desktop startup'
          if grep -qE 'Waiting for first-run setup choice|package-patch-missing' /tmp/hermes-desktop-runtime.log; then
            echo "SMOKE-FAIL: app stopped at the first-run setup screen although a runtime is installed"
            fail runtime
          fi
          wrapper_vars=$(sed -nE 's/^export ([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' /usr/bin/hermes)
          if [ -z "$wrapper_vars" ] || [ ! -s /tmp/hermes-backend.env ]; then
            echo "SMOKE-FAIL: runtime: no backend environment recorded, or no exports in /usr/bin/hermes to compare"
            fail runtime
          fi
          for var in $wrapper_vars; do
            if ! grep -q "^${var}=" /tmp/hermes-backend.env; then
              echo "SMOKE-FAIL: runtime: the backend lacks ${var}, which /usr/bin/hermes sets"
              fail runtime
            fi
          done
          echo "SMOKE-OK: app booted on the installed package runtime with the environment of /usr/bin/hermes:" $wrapper_vars

  # ---------------------------------------------------------------------------
  # Release + AUR sync: only after a merge to main or a manual dispatch ON main
  # (never from pull_request or another branch — no releases of unreviewed code).
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg

      - name: Create GitHub Release (skip if tag exists)
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: NousResearch/hermes-agent
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          UPSTREAM=$(grep -oP '(?<=^_pkgver_tag=).*' PKGBUILD)
          UPSTREAM_COMMIT=$(grep -oP '(?<=^_commit=).*' PKGBUILD)
          TAG="v${PKGVER}-${PKGREL}"
          FILE=$(ls pkg/*.pkg.tar.zst)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          # Previous upstream tag, for the compare link. Best effort only: never
          # fail the release because upstream's release list looks unexpected.
          PREV=$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" \
                   | python3 -c 'import json,sys; t=[r["tag_name"] for r in json.load(sys.stdin)]; c=sys.argv[1]; i=t.index(c) if c in t else -1; print(t[i+1] if 0 <= i and i+1 < len(t) else "")' "$UPSTREAM" \
                   2>/dev/null || true)
          {
            printf 'Prebuilt Arch package `%s-%s`, re-wrapped from the upstream source tag `%s` — nothing is compiled at install time.\n\n' \
              "$PKGVER" "$PKGREL" "$UPSTREAM"
            printf -- '- [Upstream release %s](https://github.com/%s/releases/tag/%s)\n' \
              "$UPSTREAM" "$UPSTREAM_REPO" "$UPSTREAM"
            if [ -n "$PREV" ]; then
              printf -- '- [Upstream changes %s -> %s](https://github.com/%s/compare/%s...%s)\n' \
                "$PREV" "$UPSTREAM" "$UPSTREAM_REPO" "$PREV" "$UPSTREAM"
            else
              printf -- '- [Upstream changes](https://github.com/%s/releases)\n' "$UPSTREAM_REPO"
            fi
            printf -- '\nUpstream commit: `%s`\nArtifact sha256: `%s`\n' \
              "$UPSTREAM_COMMIT" "$(sha256sum "$FILE" | cut -d' ' -f1)"
          } > /tmp/notes.md
          cat /tmp/notes.md
          # --target: tag the commit that was built, not whatever main is now.
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "hermes-agent-desktop-bin ${PKGVER}-${PKGREL}" \
            --notes-file /tmp/notes.md
          echo "Release created: $TAG"

  aur-sync:
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    # Keep AUR_SSH_KEY as a secret of this environment, restricted to main
    # (Settings → Environments): pull requests from branches of this
    # repository can read repository-level secrets.
    environment: aur
    # One publisher at a time; the main-HEAD check below drops stale runs.
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute release artifact sha256 and pin it into aur/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          FILE="hermes-agent-desktop-bin-${PKGVER}-${PKGREL}-x86_64.pkg.tar.zst"
          # Authenticated download: also works in a private copy of this repo.
          gh release download "v${PKGVER}-${PKGREL}" --repo "$GITHUB_REPOSITORY" \
            --pattern "$FILE" --output /tmp/pkg.pkg.tar.zst
          SHA=$(sha256sum /tmp/pkg.pkg.tar.zst | cut -d' ' -f1)
          sed -i -E "s|^(sha256sums=\(')[0-9a-f]{64}('\))|\1${SHA}\2|" aur/PKGBUILD
          sed -i -E "s|^([[:space:]]*sha256sums = )[0-9a-f]{64}|\1${SHA}|" aur/.SRCINFO
          # sed succeeds even when nothing matched: never publish a stale sum.
          grep -qx "sha256sums=('${SHA}')" aur/PKGBUILD
          grep -qxP "\tsha256sums = ${SHA}" aur/.SRCINFO
          echo "artifact sha256=${SHA}"

      - name: Push aur/ to AUR git (publish; dry run in copies of this repo)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          # A slower run for an older commit must not overwrite what a newer
          # main has already published.
          MAIN=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$MAIN" != "$GITHUB_SHA" ]; then
            echo "main moved on to ${MAIN}; not publishing ${GITHUB_SHA}"
            exit 0
          fi
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::error::AUR_SSH_KEY is empty — store the AUR key as a secret of the aur environment"
            exit 1
          fi
          git config --global user.name "hermes-agent-desktop-bin CI"
          git config --global user.email "jabla@users.noreply.github.com"
          rm -rf /tmp/aur
          # Only the canonical repository publishes. Copies (forks, a CI test
          # repository) clone the public AUR repository read-only and show the
          # diff they would push.
          if [ "$GITHUB_REPOSITORY" = jabla/hermes-agent-desktop-bin ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_ci && chmod 600 ~/.ssh/aur_ci
            ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ci -o IdentitiesOnly=yes"
            git clone ssh://aur@aur.archlinux.org/hermes-agent-desktop-bin.git /tmp/aur
          else
            git clone https://aur.archlinux.org/hermes-agent-desktop-bin.git /tmp/aur
          fi
          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur/
          cd /tmp/aur
          PKGVER=$(grep -oP '(?<=^pkgver=).*' PKGBUILD)
          PKGREL=$(grep -oP '(?<=^pkgrel=).*' PKGBUILD)
          # Stage first: git diff alone ignores untracked files, so a fresh
          # (empty) AUR repo would falsely report "nothing to push" and never
          # create the initial commit.
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR package up to date, nothing to push"
          elif [ "$GITHUB_REPOSITORY" != jabla/hermes-agent-desktop-bin ]; then
            echo "DRY RUN in ${GITHUB_REPOSITORY}: would push ${PKGVER}-${PKGREL} to the AUR:"
            git diff --cached
          else
            git commit -m "Update to ${PKGVER}-${PKGREL}"
            git push origin master
            echo "AUR updated to ${PKGVER}-${PKGREL}"
          fi
